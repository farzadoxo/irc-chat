services:
  redis:
    image: redis:latest
    restart: unless-stopped

  api:
    build: .
    depends_on:
      - redis
    volumes:
      - ./src:/src
    expose:
      - "7377"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/front-end:/usr/share/nginx/html:ro
