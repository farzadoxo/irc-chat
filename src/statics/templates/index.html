<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>پیام‌رسان</title>
<style>
body{font-family:sans-serif;max-width:500px;margin:40px auto}
#messages{border:1px solid #ccc;height:300px;overflow-y:auto;padding:10px;margin-bottom:10px}
.msg{margin-bottom:6px;padding:4px 6px;background:#f4f4f4;border-radius:4px}
input{width:75%;padding:6px}
button{padding:6px 10px}
</style>
</head>
<body>
<h3>💬 پیام‌رسان</h3>
<div id="messages"></div>
<input id="input" placeholder="پیامتو بنویس..."/>
<button id="sendBtn">ارسال</button>
<script>
const messagesDiv=document.getElementById("messages")
const input=document.getElementById("input")
const btn=document.getElementById("sendBtn")
let ws

async function loadMessages(){
    {% raw %}
    const res=await fetch("/api/messages")
    const data=await res.json()
    data.messages.forEach(m=>{
        const div=document.createElement("div")
        div.className="msg"
        div.innerText=m.message+" — "+m.created_at
        messagesDiv.appendChild(div)
    })
    messagesDiv.scrollTop=messagesDiv.scrollHeight
    {% endraw %}
}

function addMessage(msg){
    const div=document.createElement("div")
    div.className="msg"
    div.innerText=msg.content+" — "+msg.created_at
    messagesDiv.appendChild(div)
    messagesDiv.scrollTop=messagesDiv.scrollHeight
}

function sendMessage(){
    const text=input.value.trim()
    if(!text||ws.readyState!==1)return
    ws.send(text)
    input.value=""
}

window.onload=async()=>{
    await loadMessages()
    ws=new WebSocket("ws://192.168.1.101:8000/ws")
    ws.onmessage=e=>{
        try{addMessage(JSON.parse(e.data))}
        catch(err){console.error(err,e.data)}
    }
    btn.onclick=sendMessage
    input.addEventListener("keypress",e=>{if(e.key==="Enter")sendMessage()})
}
</script>
</body>
</html>
