<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پیام‌رسان</title>

    <link rel="stylesheet" href="/statics/styles.css" />
  </head>

  <body>
    <div class="app" id="app">
      <div class="topbar">
        <div class="avatar">💬</div>
        <div class="title">
          <div class="name">پیام‌رسان</div>
          <div class="status" id="wsStatus">در حال اتصال...</div>
        </div>
        <div class="badge" id="meBadge">Unknown</div>
      </div>

      <div id="messages"></div>

      <div class="bottombar" id="bottombar">
        <div class="form">
          <div id="aliasWrap">
            <input class="field" id="alias" placeholder="نام مستعار" />
          </div>
          <input class="field" id="input" placeholder="پیامتو بنویس..." />
          <button id="sendBtn" type="button">ارسال</button>
        </div>
      </div>
    </div>

    <script src="/statics/app.js" defer></script>
  </body>
</html>
