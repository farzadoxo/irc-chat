<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>پیام‌رسان</title>
<style>
body{
  font-family:sans-serif;
  max-width:500px;
  margin:40px auto;
}
#messages{
  border:1px solid #ccc;
  height:300px;
  overflow-y:auto;
  padding:10px;
  margin-bottom:10px;
}
.msg{
  margin-bottom:6px;
  padding:4px 6px;
  background:#f4f4f4;
  border-radius:4px;
}
#input, #alias{
  padding:6px;
}
#input{
  width:60%;
}
#alias{
  width:35%;
  margin-right:5px;
}
button{
  padding:6px 10px;
}
</style>
</head>
<body>

<h3>💬 پیام‌رسان</h3>

<div id="messages"></div>

<!-- تکست‌باکس نام مستعار -->
<input id="alias" placeholder="نام مستعار" />
<input id="input" placeholder="پیامتو بنویس..." />
<button id="sendBtn">ارسال</button>

<script>
const messagesDiv = document.getElementById("messages")
const input = document.getElementById("input")
const btn = document.getElementById("sendBtn")
const aliasInput = document.getElementById("alias")

let ws = null

function addMessage(msg){
    const div = document.createElement("div")
    div.className = "msg"
    div.innerText = (msg.username || "Unknown") + " : " + (msg.content || "")
    messagesDiv.appendChild(div)
    messagesDiv.scrollTop = messagesDiv.scrollHeight
}

async function loadMessages(){
    const res = await fetch("/api/messages")
    const data = await res.json()

    messagesDiv.innerHTML = ""

    data.messages.forEach(m => {
        // پیام‌های قدیمی بدون username
        addMessage({content: m.message, username: ""})
    })
}

function sendMessage(){
    const text = input.value.trim()
    if(!text) return
    if(!ws || ws.readyState !== WebSocket.OPEN){
        alert("WebSocket وصل نیست")
        return
    }

    const alias = aliasInput.value.trim() || "Unknown"

    // 🔴 ارسال JSON به WS
    const msg = {
        content: text,
        username: alias
    }   
    ws.send(JSON.stringify(msg))

    input.value = ""
}

window.onload = async () => {
    await loadMessages()

    ws = new WebSocket("ws://192.168.1.101:8000/ws")

    ws.onopen = () => console.log("WS CONNECTED")

    ws.onmessage = (e) => {
        try{
            const data = JSON.parse(e.data)
            addMessage(data)
        }catch(err){
            console.error("parse error", e.data)
        }
    }

    ws.onerror = e => console.error("WS ERROR", e)
    ws.onclose = () => console.log("WS CLOSED")

    btn.onclick = sendMessage

    input.addEventListener("keydown", e => {
        if(e.key === "Enter"){
            e.preventDefault()
            sendMessage()
        }
    })
}
</script>

</body>
</html>
